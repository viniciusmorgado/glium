[package]
name = "glium"
version = "0.36.0"
authors = ["Vinicius Donatto Morgado <34577818+viniciusmorgado@users.noreply.github.com>"]
description = """
Elegant and safe OpenGL wrapper.

SafeGL is an intermediate layer between OpenGL and your application. You still need to manually handle
the graphics pipeline, but without having to use OpenGL's old and error-prone API.

This project is a fork of glium, maintained by Oxidian Studios, a video game company, with the intent of using
it to develop graphical tools for internal use.

Its objectives:
    - Be safe to use. Many aspects of OpenGL that can trigger a crash if misused are automatically handled by SafeGL.
    - Provide an API that enforces good practices such as RAII or stateless function calls.
    - Be compatible with OpenGL 4.6 for modern desktops and OpenGL ES 3.0 for embedded devices.
    - Avoid all OpenGL errors beforehand.
    - Produce optimized OpenGL function calls, and allow the user to easily use modern OpenGL techniques.
"""
keywords = ["opengl", "gamedev"]
categories = ["api-bindings", "rendering::graphics-api"]
documentation = "https://docs.rs/glium"
repository = "https://github.com/glium/glium"
readme = "README.md"
license = "Apache-2.0"
build = "build/main.rs"
exclude = ["doc"]
edition = "2021"

[features]
default = ["glutin_backend", "simple_window_builder", "glutin/default", "winit/default", "glutin-winit/default"]
glutin_backend = ["glutin"]
unstable = [] # used for benchmarks
vk_interop = [] # used for texture import from Vulkan
simple_window_builder = ["glutin", "glutin-winit", "winit", "raw-window-handle"] # used in the tutorial

[dependencies.glutin]
version = "0.32.3"
features = []
optional = true
default-features = false

[dependencies.glutin-winit]
version = "0.5.0"
features = []
optional = true
default-features = false

[dependencies.winit]
version = "0.30"
features = []
optional = true
default-features = false

[dependencies.raw-window-handle]
version = "0.6.2"
features = []
optional = true
default-features = false

[dependencies]
memoffset = "0.9.1"
backtrace = "0.3.76"
smallvec = "1.16.4"
fnv = "1.0.7"

[build-dependencies]
gl_generator = "0.14.0"

[dev-dependencies]
ouroboros = "0.18.5"
nalgebra = "0.35.0"
genmesh = "0.6.2"
image = "0.25.10"
obj = { version = "0.10.2", features = ["genmesh"] }
rand = "0.10.3"
libc = "0.2.191"
winit = "0.30.13"
raw-window-handle = "0.6.2"
glutin-winit = "0.5.0"
takeable-option = "0.5.0"

[package.metadata.docs.rs]
all-features = true
