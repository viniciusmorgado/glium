name: ci

on: [ push, pull_request ]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        toolchain: [ stable, beta, nightly ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@master
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true

      - name: Install cargo audit
        run: |
          cargo install cargo-audit

      - name: Run cargo audit
        run: |
          cargo audit

      - name: Run cargo check --all
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --all --all-targets

      - name: Compile the tests
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --all --all-targets --no-run
      - name: Run cargo doc
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo doc --all --all-features
  targets:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            features: gl41,glutin_backend,glutin/default
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            features: webgl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@master
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Check the tier for the target
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      - name: Build the WebGL example
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          cargo build --manifest-path examples/web/Cargo.toml --target wasm32-unknown-unknown
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Install mdbook
        run: |
          sudo snap install mdbook
      - name: Run mdbook
        run: |
          cd book && mdbook build
          mkdir gh-pages && mv book gh-pages
      - name: Deploy to gh pages
        uses: JamesIves/github-pages-deploy-action@v4.2.3
        with:
          branch: gh-pages
          folder: book/gh-pages
        if: github.event_name == 'push'
